name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Build y pruebas JUnit contra MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        # La misma versión que el entorno de desarrollo del ramo.
        image: mariadb:10.6
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Ant con la tarea <junit>
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ant ant-optional

      - name: Cache de JUnit 4
        uses: actions/cache@v4
        with:
          path: .ci-libs
          key: junit-4.13.2-hamcrest-1.3

      - name: Cargar SQL, compilar y correr las 24 pruebas
        run: bash scripts/ci.sh

  imagen:
    name: Build de la imagen de NetBeans (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker-compose.yml es válido
        run: docker compose config -q

      # Construye exactamente lo que construye un compañero con
      # "docker compose up -d --build": si la descarga de NetBeans o su
      # checksum fallan, se ve aquí y no en el PC de alguien.
      - name: Construir la imagen
        run: docker compose build netbeans

      - name: NetBeans y el JDK quedaron dentro de la imagen
        run: |
          docker run --rm --entrypoint /bin/sh calendario-netbeans:local -c \
            'test -x /opt/netbeans/bin/netbeans && java -version 2>&1 | head -1'
